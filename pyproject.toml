[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "coursedata"
version = "0.0.1"
description = "Manage and report on data for a course in a semester"
authors = [
  { name = "Matthew Leingang" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "ipython",
    "jupyterlab",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "keyring",
    "reportlab",
# Since this module is still in development
# install with `uv pip install ../python-edubag`
#    "python-edubag @ git+https://github.com/nyumathclinic/python-edubag.git"
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["coursedata"]
include = ["pyproject.toml", "coursedata/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["coursedata"]
force-sort-within-sections = true

